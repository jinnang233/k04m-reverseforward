/**
 * Loads the build plugins that supply Minecraft integration and artifact tasks.
 */
plugins {
    id "java-library"
    id "net.neoforged.moddev" version "${moddev_version}"
}

version = project.mod_version
group = project.maven_group

/**
 * Sets artifact naming from the existing project properties.
 */
base {
    archivesName = project.archives_base_name
}

/**
 * Declares dependency repositories used by the build tool.
 */
repositories {
    mavenCentral()
}

sourceSets.main.java.srcDir("../src/common/java")

/**
 * Declares external libraries and test dependencies; cryptographic behavior belongs to runtime code.
 */
dependencies {
    compileOnly files("../libs/Krypt04Mcg.jar")
}

neoForge {
    version = project.neoforge_version
    runs {
        client { client() }
    }
    mods {
        k04m_reverse_forward {
            sourceSet sourceSets.main
        }
    }
}

/**
 * Configures the named build task with the existing compilation, verification or packaging settings.
 */
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
}

/**
 * Configures the Java toolchain compatibility and source artifact generation.
 */
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

/**
 * Expands build metadata in resources without changing runtime protocol settings.
 */
processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

/**
 * Configures the named build task with the existing compilation, verification or packaging settings.
 */
tasks.named("jar") {
    from("../LICENSE") {
        rename { "LICENSE_k04m-reverse-forward" }
    }
}
